<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blû Offline</title>
  <link rel="icon" href="./assets/blu.svg" type="image/svg+xml">
  <style id="offlineFallbackStyle">
    body.offline-loading { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1119; color: #f3f4fa; font: 14px/1.5 system-ui, sans-serif; }
    #offlineBootstrap { box-sizing: border-box; width: min(420px, calc(100% - 32px)); padding: 24px; border: 1px solid #30374b; border-radius: 14px; background: #191e2b; }
    #offlineBootstrap h1 { margin: 0 0 8px; font-size: 20px; }
    #offlineBootstrap p { margin: 0 0 16px; color: #bac2d5; }
    #offlineBootstrap a { color: #92aaff; }
    #offlineBootstrap button { margin-bottom: 16px; padding: 9px 14px; border: 0; border-radius: 7px; background: #6278ee; color: white; cursor: pointer; }
    #offlineBootstrap [hidden] { display: none !important; }
  </style>
  <script src="/sprinklr/loader.js" defer></script>
</head>
<body class="offline-loading">
  <main id="offlineBootstrap" role="status">
    <h1>Blû Offline</h1>
    <p id="offlineBootstrapMessage">Carregando o Blû Offline…</p>
    <button id="offlineBootstrapRetry" type="button" hidden>Tentar novamente</button>
    <div><a href="https://github.com/Raianwz/blu/tree/blu/offline">Arquivos para uso local</a></div>
  </main>
</body>
</html>
