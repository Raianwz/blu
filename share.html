<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="/assets/blu.svg" type="image/svg+xml">
  <title>Blû — Link Compartilhado</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <script>
    // Aplica o tema antes de renderizar o cartão, evitando o flash do tema
    // claro. A chave antiga é aceita para links abertos antes da migração.
    (() => {
      let storedTheme = null;
      try {
        const settings = JSON.parse(localStorage.getItem('blu:settings') || '{}');
        storedTheme = settings?.theme || localStorage.getItem('blu:theme');
      } catch (_) {}

      const dark = storedTheme === 'dark'
        || (storedTheme !== 'light' && window.matchMedia?.('(prefers-color-scheme: dark)').matches);
      document.body.classList.toggle('dark', dark);
    })();
  </script>
  <div class="share-page">
    <div class="share-card">
      <img class="share-logo" src="/assets/blu.svg" alt="Blû" width="56" height="56">
      <h1 id="shareTitle">Carregando link compartilhado…</h1>
      <p id="shareDesc" class="share-desc"></p>
      <div id="shareActions" class="share-actions"></div>
    </div>
  </div>

  <div class="modal-bg share-import-dialog" id="dialogModal">
    <div class="modal">
      <h2 id="dialogTitle">Confirmar ação</h2>
      <p id="dialogMessage"></p>
      <div class="form-group" id="dialogInputWrap" style="display:none;">
        <input id="dialogInput" type="text">
      </div>
      <div class="modal-footer">
        <button class="mbtn secondary" id="dialogCancelBtn">Cancelar</button>
        <button class="mbtn primary" id="dialogConfirmBtn">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="notifArea"></div>

  <script src="/js/utils.js"></script>
  <script src="/js/dialogs.js"></script>
  <script src="/js/crypto.js"></script>
  <script>
    // Chave usada pelo app principal (js/storage.js) para o autosave —
    // mantida em sincronia manualmente aqui, já que esta página não
    // carrega o storage.js inteiro (que depende de elementos do DOM
    // que só existem no index.html).
    const STORAGE_KEY = 'blu:data';

    setupDialogEvents();

    function getShareCode() {
      const match = window.location.pathname.match(/\/(?:share|s)\/([^/]+)/);
      return match ? decodeURIComponent(match[1]) : '';
    }

    function isAliasSharePath() {
      return window.location.pathname.startsWith('/s/');
    }

    function isLocalDevelopment() {
      return ['localhost', '127.0.0.1'].includes(window.location.hostname);
    }

    async function fetchSharedData(code) {
      if (isLocalDevelopment()) {
        const response = await fetch('/demo2_dev.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Não foi possível carregar demo2_dev.json (HTTP ${response.status})`);
        return response.json();
      }

      const aliasQuery = isAliasSharePath() ? '?alias=1' : '';
      const response = await fetch(`/api/share/${encodeURIComponent(code)}${aliasQuery}`);

      if (response.status === 404) {
        const error = new Error('Link expirado ou inexistente');
        error.code = 'SHARE_NOT_FOUND';
        throw error;
      }

      if (response.status === 429) {
        const error = new Error('Muitas tentativas');
        error.code = 'SHARE_RATE_LIMIT';
        throw error;
      }

      if (!response.ok) throw new Error('HTTP ' + response.status);
      const payload = await response.json();
      return payload.data;
    }

    async function loadShare() {
      const titleEl = document.getElementById('shareTitle');
      const descEl = document.getElementById('shareDesc');
      const actionsEl = document.getElementById('shareActions');
      const code = getShareCode();

      if (!code && !isLocalDevelopment()) {
        titleEl.textContent = 'Link inválido';
        descEl.textContent = 'Não encontramos um código de compartilhamento nesta URL.';
        return;
      }

      try {
        const data = await fetchSharedData(code);
        let parsed = typeof data === 'string' ? JSON.parse(data) : data;

        if (isEncryptedPayload(parsed)) {
          const decryptedString = await decryptJsonPayload(parsed);
          parsed = JSON.parse(decryptedString);
        }

        const normalized = normalizeImportedData(parsed);
        const sectionCount = normalized.sections.length;
        const buttonCount = normalized.sections.reduce((sum, section) => sum + section.buttons.length, 0);

        titleEl.textContent = '📥 Alguém compartilhou dados com você';
        descEl.textContent = `${sectionCount} seção(ões) e ${buttonCount} botão(ões) encontrados neste link.`;

        const importBtn = document.createElement('button');
        importBtn.className = 'mbtn primary';
        importBtn.textContent = 'Importar para o Blû';
        importBtn.onclick = () => importShare(normalized);

        const cancelLink = document.createElement('a');
        cancelLink.href = '/';
        cancelLink.className = 'mbtn secondary';
        cancelLink.textContent = 'Ir para o Blû sem importar';

        actionsEl.append(importBtn, cancelLink);
      } catch (error) {
        if (error.code === 'SHARE_NOT_FOUND') {
          titleEl.textContent = 'Link expirado ou inexistente';
          descEl.textContent = 'Este link de compartilhamento não existe mais, ou já passou do prazo de 3 dias.';
          return;
        }

        if (error.code === 'SHARE_RATE_LIMIT') {
          titleEl.textContent = 'Muitas tentativas';
          descEl.textContent = 'Aguarde um pouco antes de tentar novamente.';
          return;
        }

        console.error('Erro ao carregar compartilhamento:', error);
        titleEl.textContent = 'Não foi possível carregar';
        descEl.textContent = 'Houve um erro ao processar este link. Tente novamente mais tarde.';
      }
    }

    async function importShare(normalized) {
      const ok = await confirmDialog(
        'Isso substituirá todos os dados atuais do Blû neste navegador. Continuar?',
        { title: '📥 Importar Compartilhamento', danger: true, confirmText: 'Importar' }
      );
      if (!ok) return;

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
        notify('Importado! Redirecionando…');
        setTimeout(() => { window.location.replace('/'); }, 700);
      } catch (error) {
        console.error('Erro ao salvar localmente:', error);
        notify('Não foi possível salvar localmente neste navegador.', 'err');
      }
    }

    loadShare();
  </script>
</body>
</html>
