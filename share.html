<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="/assets/blu.svg" type="image/svg+xml">
  <title>Blû — Link Compartilhado</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <script>
    // Aplica o tema antes de renderizar o cartão, evitando o flash do tema
    // claro. A chave antiga é aceita para links abertos antes da migração.
    (() => {
      let storedTheme = null;
      try {
        const settings = JSON.parse(localStorage.getItem('blu:settings') || '{}');
        storedTheme = settings?.theme || localStorage.getItem('blu:theme');
      } catch (_) {}

      const dark = storedTheme === 'dark'
        || (storedTheme !== 'light' && window.matchMedia?.('(prefers-color-scheme: dark)').matches);
      document.body.classList.toggle('dark', dark);
    })();
  </script>
  <div class="share-page">
    <div class="share-card">
      <img class="share-logo" src="/assets/blu.svg" alt="Blû" width="56" height="56">
      <h1 id="shareTitle">Carregando link compartilhado…</h1>
      <p id="shareDesc" class="share-desc"></p>
      <div id="shareActions" class="share-actions"></div>
    </div>
  </div>

  <div class="modal-bg share-import-dialog" id="dialogModal">
    <div class="modal">
      <h2 id="dialogTitle">Confirmar ação</h2>
      <p id="dialogMessage"></p>
      <div class="form-group" id="dialogInputWrap" style="display:none;">
        <input id="dialogInput" type="text">
      </div>
      <div class="modal-footer">
        <button class="mbtn secondary" id="dialogCancelBtn">Cancelar</button>
        <button class="mbtn primary" id="dialogConfirmBtn">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="customImportModal">
    <div class="modal custom-import-modal" role="dialog" aria-modal="true" aria-labelledby="customImportTitle">
      <h2 id="customImportTitle">🔀 Personalizar importação</h2>
      <div class="custom-import-steps" role="tablist" aria-label="Etapas da importação">
        <button id="customImportCompareTab" class="active" type="button" role="tab" aria-selected="true" aria-controls="customImportComparePanel" onclick="setCustomImportStep('compare')">1. Comparar</button>
        <button id="customImportReviewTab" type="button" role="tab" aria-selected="false" aria-controls="customImportReviewPanel" onclick="setCustomImportStep('review')">2. Revisar</button>
      </div>

      <section id="customImportComparePanel" class="custom-import-panel" role="tabpanel" aria-labelledby="customImportCompareTab">
        <p class="custom-import-intro">Escolha o que será incorporado. Seus itens locais não serão apagados.</p>
        <div id="customImportSummary" class="custom-import-summary" role="status" aria-live="polite"></div>
        <div class="custom-import-toolbar">
          <label>Seleção inicial
            <select id="customImportPreset" onchange="applyCustomImportPreset(this.value)">
              <option value="new">Adicionar apenas novidades</option>
              <option value="update">Adicionar e atualizar</option>
              <option value="manual">Selecionar manualmente</option>
            </select>
          </label>
          <label class="custom-import-toggle"><input id="customImportShowSame" type="checkbox" onchange="renderCustomImportTree()"> Mostrar itens idênticos</label>
        </div>
        <div class="custom-import-filterbar">
          <label for="customImportSearch"><span>Pesquisar</span><input id="customImportSearch" type="search" placeholder="Seção, botão, texto ou tag..." autocomplete="off" oninput="filterCustomImportTree()"></label>
          <button id="customImportToggleSectionsBtn" class="mbtn ghost" type="button" onclick="toggleAllCustomImportSections()" title="Expandir ou minimizar categorias — Ctrl + E">Minimizar tudo</button>
        </div>
        <div id="customImportTree" class="custom-import-tree" aria-label="Diferenças encontradas"></div>
      </section>

      <section id="customImportReviewPanel" class="custom-import-panel" role="tabpanel" aria-labelledby="customImportReviewTab" hidden>
        <div id="customImportReviewSummary" class="custom-import-review-summary" role="status" aria-live="polite"></div>
        <div id="customImportReviewList" class="custom-import-review-list"></div>
        <p class="custom-import-safety">Nenhum item local será removido. Um snapshot permitirá desfazer a importação com Ctrl+Z após abrir o Blû.</p>
      </section>

      <div class="modal-footer custom-import-footer">
        <button class="mbtn cancel" type="button" onclick="closeCustomImport()">Cancelar</button>
        <button id="customImportBackBtn" class="mbtn ghost" type="button" onclick="setCustomImportStep('compare')" hidden>Voltar</button>
        <button id="customImportNextBtn" class="mbtn primary" type="button" onclick="setCustomImportStep('review')">Revisar importação</button>
        <button id="customImportApplyBtn" class="mbtn primary" type="button" onclick="applyCustomImport()" hidden>Importar selecionados</button>
      </div>
    </div>
  </div>

  <div id="notifArea"></div>

  <script src="/js/utils.js"></script>
  <script src="/js/dialogs.js"></script>
  <script src="/js/crypto.js"></script>
  <script src="/js/share-import.js"></script>
  <script>
    // Chave usada pelo app principal (js/storage.js) para o autosave —
    // mantida em sincronia manualmente aqui, já que esta página não
    // carrega o storage.js inteiro (que depende de elementos do DOM
    // que só existem no index.html).
    const STORAGE_KEY = 'blu:data';

    setupDialogEvents();

    function getShareCode() {
      const match = window.location.pathname.match(/\/(?:share|s)\/([^/]+)/);
      return match ? decodeURIComponent(match[1]) : '';
    }

    function isAliasSharePath() {
      return window.location.pathname.startsWith('/s/');
    }

    function isLocalDevelopment() {
      return ['localhost', '127.0.0.1'].includes(window.location.hostname);
    }

    async function fetchSharedData(code) {
      if (isLocalDevelopment()) {
        const response = await fetch('/assets/demo2_dev.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Não foi possível carregar assets/demo2_dev.json (HTTP ${response.status})`);
        return response.json();
      }

      const aliasQuery = isAliasSharePath() ? '?alias=1' : '';
      const response = await fetch(`/api/share/${encodeURIComponent(code)}${aliasQuery}`);

      if (response.status === 404) {
        const error = new Error('Link expirado ou inexistente');
        error.code = 'SHARE_NOT_FOUND';
        throw error;
      }

      if (response.status === 429) {
        const error = new Error('Muitas tentativas');
        error.code = 'SHARE_RATE_LIMIT';
        throw error;
      }

      if (!response.ok) throw new Error('HTTP ' + response.status);
      const payload = await response.json();
      return payload.data;
    }

    async function loadShare() {
      const titleEl = document.getElementById('shareTitle');
      const descEl = document.getElementById('shareDesc');
      const actionsEl = document.getElementById('shareActions');
      const code = getShareCode();

      if (!code && !isLocalDevelopment()) {
        titleEl.textContent = 'Link inválido';
        descEl.textContent = 'Não encontramos um código de compartilhamento nesta URL.';
        return;
      }

      try {
        const data = await fetchSharedData(code);
        let parsed = typeof data === 'string' ? JSON.parse(data) : data;

        if (isEncryptedPayload(parsed)) {
          const decryptedString = await decryptJsonPayload(parsed);
          parsed = JSON.parse(decryptedString);
        }

        const normalized = normalizeImportedData(parsed);
        const sectionCount = normalized.sections.length;
        const buttonCount = normalized.sections.reduce((sum, section) => sum + section.buttons.length, 0);

        titleEl.textContent = '📥 Alguém compartilhou dados com você';
        descEl.textContent = `${sectionCount} seção(ões) e ${buttonCount} botão(ões) encontrados neste link.`;

        const importBtn = document.createElement('button');
        importBtn.className = 'mbtn primary';
        importBtn.textContent = 'Importar para o Blû';
        importBtn.onclick = () => importShare(normalized);

        const localData = getLocalShareImportData();
        if (localData) {
          const customImportBtn = document.createElement('button');
          customImportBtn.className = 'mbtn share-custom-import-action';
          customImportBtn.textContent = 'Personalizar importação';
          customImportBtn.setAttribute('aria-haspopup', 'dialog');
          customImportBtn.onclick = () => openCustomImport(localData, normalized);
          actionsEl.append(importBtn, customImportBtn);
        } else {
          actionsEl.append(importBtn);
        }

        const cancelLink = document.createElement('a');
        cancelLink.href = '/';
        cancelLink.className = 'mbtn share-exit-action';
        cancelLink.textContent = 'Voltar ao Blû sem importar';

        actionsEl.append(cancelLink);
      } catch (error) {
        if (error.code === 'SHARE_NOT_FOUND') {
          titleEl.textContent = 'Link expirado ou inexistente';
          descEl.textContent = 'Este link de compartilhamento não existe mais, ou já passou do prazo de 3 dias.';
          return;
        }

        if (error.code === 'SHARE_RATE_LIMIT') {
          titleEl.textContent = 'Muitas tentativas';
          descEl.textContent = 'Aguarde um pouco antes de tentar novamente.';
          return;
        }

        console.error('Erro ao carregar compartilhamento:', error);
        titleEl.textContent = 'Não foi possível carregar';
        descEl.textContent = 'Houve um erro ao processar este link. Tente novamente mais tarde.';
      }
    }

    async function importShare(normalized) {
      const ok = await confirmDialog(
        'Isso substituirá todos os dados atuais do Blû neste navegador. Continuar?',
        { title: '📥 Importar Compartilhamento', danger: true, confirmText: 'Importar' }
      );
      if (!ok) return;

      try {
        saveShareImportUndoSnapshot();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
        notify('Importado! Redirecionando…');
        setTimeout(() => { window.location.replace('/'); }, 700);
      } catch (error) {
        console.error('Erro ao salvar localmente:', error);
        notify('Não foi possível salvar localmente neste navegador.', 'err');
      }
    }

    loadShare();
  </script>
</body>
</html>
